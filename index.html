<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Walter's Home Check</title>
  <meta name="description" content="Walter's Home Check — a room-by-room home inspection checklist for home buyers and homeowners.">
  <meta name="theme-color" content="#1b2a41">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Home Check">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Apply the chosen light/dark setting before the page draws (avoids a flash).
    try { var t = localStorage.getItem('whc-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Skip to main content</a>
  <header class="app-header">
    <div class="app-header__inner">
      <button type="button" class="header-btn" id="back-btn" hidden aria-label="Back">
        <svg class="icon" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <a class="brand" href="#/" id="brand">
        <img class="brand__avatar" src="assets/walter-avatar.png" alt="" width="40" height="40">
        <span class="brand__name">Walter's Home Check</span>
      </a>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <p class="loading">Loading…</p>
  </main>

  <nav class="tabbar" id="tabbar" aria-label="Main" hidden></nav>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <noscript>
    <p class="noscript">This app needs JavaScript turned on in your browser.</p>
  </noscript>

  <script type="module" src="js/app.js"></script>
</body>
</html>
